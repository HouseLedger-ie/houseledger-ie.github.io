<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HouseLedger — Review submissions</title><style>:root{font-family:system-ui,Arial;color:#19323a}body{margin:0;background:#f8f7f3}header{background:#173943;color:white;padding:22px max(20px,calc((100% - 950px)/2))}main{max-width:950px;margin:35px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe4df;border-radius:14px;padding:23px;margin:17px 0;line-height:1.6}input{width:100%;padding:11px;margin:4px 0 13px;border:1px solid #ccd9d4;border-radius:8px;box-sizing:border-box}button{background:#22755c;color:white;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer;margin:3px}button.reject{background:#934844}button.secondary{background:#e7efeb;color:#173943}button:disabled{opacity:.5}p.small{font-size:13px;color:#657570;overflow-wrap:anywhere}pre{white-space:pre-wrap;word-break:break-word;background:#f4f7f5;padding:12px;border-radius:9px}a{color:inherit}</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header><h1>HouseLedger — Moderation</h1><a href="index.html">← Public website</a></header><main><div id="message"></div><section id="login" class="panel"><h2>Admin sign in</h2><p class="small">Only an account added to the <code>admins</code> table can review submissions.</p><label>Email<input id="email" autocomplete="username" type="email"></label><label>Password<input id="password" autocomplete="current-password" type="password"></label><button id="sign-in">Sign in</button></section><section id="review" hidden><div class="panel"><button id="reload">Refresh queue</button><button class="secondary" id="logout">Sign out</button><p class="small">Review all text for personal information and confirm the reported costs are plausible before publishing. Approval does not mean independently verified.</p></div><div id="queue"></div></section></main><script>
'use strict';
const cfg=window.BUILDCOST_CONFIG||{};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const client=cfg.supabaseUrl&&cfg.supabaseAnonKey&&window.supabase?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
const message=(text,error=false)=>{$('message').innerHTML=`<div class="panel" role="status" style="border-color:${error?'#c76f64':'#aacdbd'}">${esc(text)}</div>`};
async function login(){if(!client){message('Configure config.js first, and connect to the internet to load the authentication library.',true);return}try{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;await init()}catch(e){message(e.message,true)}}
async function init(){if(!client){message('Supabase configuration is missing.',true);return}const {data:{user}}=await client.auth.getUser();if(!user){$('login').hidden=false;$('review').hidden=true;return}const {data,error}=await client.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){message('You are signed in but this account is not approved as an admin.',true);await client.auth.signOut();return}$('login').hidden=true;$('review').hidden=false;$('message').innerHTML='';await load()}
async function load(){const {data,error}=await client.from('builds').select('*').eq('status','pending').order('created_at',{ascending:false}).limit(200);if(error){message(error.message,true);return}$('queue').innerHTML=`<h2>Pending submissions (${data.length})</h2>`+(!data.length?'<div class="panel">No pending submissions.</div>':data.map(x=>{const fields=['title','county','year','size','storeys','rooms','method','finish','structure','ber','cost','budget','include_site','breakdown_mode','site','fees','ground','shell','services','interior','external','included','excluded','notes'];return `<article class="panel"><h3>${esc(x.title)} — €${Number(x.cost).toLocaleString('en-IE')}</h3><p class="small">Submitted ${esc(new Date(x.created_at).toLocaleString('en-IE'))}</p><details><summary>Review all submitted fields</summary><pre>${fields.map(k=>`${esc(k)}: ${esc(x[k]??'Not supplied')}`).join('\n')}</pre></details><button data-action="approved" data-id="${esc(x.id)}">Approve</button><button class="reject" data-action="rejected" data-id="${esc(x.id)}">Reject</button></article>`}).join(''));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>changeStatus(b.dataset.id,b.dataset.action,b))}
async function changeStatus(id,status,button){if(!confirm(status==='approved'?'Publish this build publicly?':'Reject this submission?'))return;button.disabled=true;const {error}=await client.from('builds').update({status}).eq('id',id);if(error){message(error.message,true);button.disabled=false}else await load()}
$('sign-in').onclick=login;$('reload').onclick=load;$('logout').onclick=async()=>{await client.auth.signOut();$('login').hidden=false;$('review').hidden=true};init();
</script></body></html>
